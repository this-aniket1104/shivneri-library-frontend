name: Frontend Next.js CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        working-directory: ./
        run: npm ci

      - name: Verify Build
        working-directory: ./
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://dummy-api.example.com
